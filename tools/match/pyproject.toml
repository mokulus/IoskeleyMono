[project]
name = "ioskeley-match"
version = "0.1.0"
description = "Score Ioskeley Mono builds against reference glyphs"
requires-python = ">=3.11"
dependencies = [
  "fonttools>=4.50",
  "freetype-py>=2.4",
  "numpy>=1.26",
  "pillow>=10.1",
  "pymupdf>=1.24",
]

[project.scripts]
match = "match:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["match.py"]
